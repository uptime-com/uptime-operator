apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-api
  annotations:
    monitoring.uptime.com/enabled: "true"
    monitoring.uptime.com/path: /healthz
    monitoring.uptime.com/interval: "5"
    monitoring.uptime.com/expect-status: "200"
    monitoring.uptime.com/contact-groups: "Default"
    # Optional: omit to use the operator's default token Secret.
    monitoring.uptime.com/api-token-secret: uptime-token
    # locations is required by the Uptime.com API. Comma-separated probe location
    # names from /api/v1/probe-servers/.
    monitoring.uptime.com/locations: "US-NY-New York,US-CA-Los Angeles,US-TX-Dallas,United Kingdom-London,Austria-Vienna"
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 8080
  tls:
    - hosts:
        - api.example.com
      secretName: api-example-com-tls
