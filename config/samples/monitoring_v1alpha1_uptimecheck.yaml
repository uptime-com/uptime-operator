apiVersion: v1
kind: Secret
metadata:
  name: uptime-token
type: Opaque
stringData:
  token: REPLACE_WITH_UPTIME_COM_API_TOKEN
---
apiVersion: monitoring.uptime.com/v1alpha1
kind: UptimeCheck
metadata:
  labels:
    app.kubernetes.io/name: uptime-operator
  name: example-health
spec:
  type: HTTP
  interval: 5
  contactGroups:
    - Default
  # locations is required by the Uptime.com API. Pick at least one probe
  # location name from /api/v1/probe-servers/. The list below is a good default
  # spread across the US, UK, and Austria.
  locations:
    - US-NY-New York
    - US-CA-Los Angeles
    - US-TX-Dallas
    - United Kingdom-London
    - Austria-Vienna
  tags:
    - example
  # Optional: drop this block to use the operator's default token Secret
  # (--default-api-token-secret-name, read from the operator's namespace).
  apiTokenSecretRef:
    name: uptime-token
    key: token
  http:
    url: https://example.com/healthz
    statusCode: "200"
    encryption: ssl_verify
    numRetries: 2
