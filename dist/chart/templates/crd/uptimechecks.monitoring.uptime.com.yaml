{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: uptimechecks.monitoring.uptime.com
spec:
  group: monitoring.uptime.com
  names:
    kind: UptimeCheck
    listKind: UptimeCheckList
    plural: uptimechecks
    singular: uptimecheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.http.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.remoteCheckID
      name: RemoteID
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UptimeCheck is the Schema for the uptimechecks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of UptimeCheck
            properties:
              apiTokenSecretRef:
                description: |-
                  apiTokenSecretRef points to a Secret in the same namespace holding the
                  Uptime.com API token under key "token" (override with .key).
                  When omitted, the operator falls back to its own default token Secret
                  (--default-api-token-secret-name); reconciliation fails with
                  TokenNotConfigured if no default is configured either.
                properties:
                  key:
                    default: token
                    description: key inside the Secret's data map.
                    type: string
                  name:
                    description: name of the Secret resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              apiURL:
                description: |-
                  apiURL overrides the Uptime.com API base URL. Defaults to
                  https://uptime.com/api/v1/. Useful for pointing the operator at the
                  sandbox or a self-hosted instance. Must end with /api/v1/.
                maxLength: 2048
                pattern: ^https?://.+/api/v1/?$
                type: string
              contactGroups:
                description: contactGroups are Uptime.com contact group names to notify
                  on alert.
                items:
                  type: string
                type: array
              http:
                description: http is the HTTP-specific configuration. Required when
                  type=HTTP.
                properties:
                  encryption:
                    description: 'encryption: ssl, ssl_verify, or empty for none.
                      Applies to https URLs.'
                    enum:
                    - ""
                    - ssl
                    - ssl_verify
                    type: string
                  expectString:
                    description: expectString fails the check if missing from response
                      body.
                    type: string
                  headers:
                    description: 'headers in "Key: Value" form, one per line.'
                    type: string
                  numRetries:
                    default: 2
                    description: numRetries before flipping the check to down.
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  sendString:
                    description: sendString is sent as the request body.
                    type: string
                  statusCode:
                    default: "200"
                    description: statusCode is the expected HTTP status (or comma-separated
                      list).
                    type: string
                  threshold:
                    description: threshold is the response-time threshold in seconds.
                      0 = no threshold.
                    format: int32
                    minimum: 0
                    type: integer
                  url:
                    description: url is the full URL to probe (scheme required).
                    maxLength: 2048
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
              interval:
                default: 5
                description: interval is the check frequency in minutes.
                format: int32
                maximum: 1440
                minimum: 3
                type: integer
              locations:
                description: |-
                  locations restricts probing to specific Uptime.com regions
                  (e.g. "US East", "EU West"). Empty = Uptime.com defaults.
                items:
                  type: string
                type: array
              name:
                description: |-
                  name is the human-friendly check name shown in the Uptime.com UI.
                  When empty, the operator derives it from "<namespace>/<resource-name>".
                maxLength: 200
                type: string
              paused:
                description: paused stops the check from running without deleting
                  it remotely.
                type: boolean
              tags:
                description: |-
                  tags are extra Uptime.com tags. The operator additionally injects its
                  own ownership tags - users do not need to manage those.
                items:
                  type: string
                type: array
              type:
                description: type selects which transport block (currently only http)
                  is honored.
                enum:
                - HTTP
                type: string
            required:
            - type
            type: object
          status:
            description: status defines the observed state of UptimeCheck
            properties:
              conditions:
                description: |-
                  conditions report the current state of the resource.
                  Types: Ready (overall health), Synced (last reconcile outcome).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation last successfully
                  reconciled with the Uptime.com API.
                format: int64
                type: integer
              remoteCheckID:
                description: |-
                  remoteCheckID is the Uptime.com primary key for the managed check.
                  Used to address subsequent update/delete calls without searching.
                format: int64
                type: integer
              remoteCheckURL:
                description: remoteCheckURL is the Uptime.com API URL of the managed
                  check.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
